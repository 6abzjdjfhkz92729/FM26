<div id="setup"><div class="sc"><h1>FOOTBALL MANAGER 26 <small class="mu">Mobile</small></h1><p class="mu">Crée ton manager et choisis ton club.</p>
<div class="row"><div><label>Prénom</label><input id="fn" placeholder="Côme"><label>Nom</label><input id="ln" placeholder="Dupont"><label>Formation</label><select id="fo"><option>4-3-3</option><option>4-2-3-1</option><option>4-4-2</option></select></div>

<script>
const LG={"Premier League":["Arsenal","Aston Villa","Bournemouth","Brentford","Brighton","Burnley","Chelsea","Crystal Palace","Everton","Fulham","Leeds","Liverpool","Man City","Man United","Newcastle","Nottingham Forest","Sunderland","Tottenham","West Ham","Wolves"],"La Liga":["Athletic Club","Atlético","Barcelona","Celta","Getafe","Girona","Mallorca","Osasuna","Rayo","Betis","Real Madrid","Real Sociedad","Sevilla","Valencia","Villarreal","Alavés","Espanyol","Levante"],"Serie A":["Atalanta","Bologna","Cagliari","Como","Fiorentina","Genoa","Inter","Juventus","Lazio","Lecce","Milan","Napoli","Parma","Roma","Torino","Udinese","Verona","Sassuolo"],"Bundesliga":["Augsburg","Leverkusen","Bayern","Dortmund","Gladbach","Frankfurt","Freiburg","Heidenheim","Hoffenheim","Mainz","Leipzig","St. Pauli","Stuttgart","Union Berlin","Bremen","Wolfsburg","Hamburg","Köln"],"Ligue 1":["Angers","Auxerre","Brest","Le Havre","Lens","Lille","Lorient","Lyon","Marseille","Metz","Monaco","Nantes","Nice","Paris SG","Rennes","Strasbourg","Toulouse","Paris FC"]};
const BIG=["Man City","Arsenal","Liverpool","Chelsea","Real Madrid","Barcelona","Bayern","Inter","Paris SG","Leverkusen","Dortmund","Milan","Juventus","Napoli","Atlético","Man United","Tottenham","Newcastle"];
const FN=["Lucas","Hugo","Noah","Leo","Marco","Diego","Jamal","Kai","Mateo","Enzo","Luca","Theo","Rafa","Jonas","Declan","Bruno","Pedro","Karim","Florian","Ethan"],LN=["Martin","Silva","Rossi","Müller","Garcia","Costa","Kovac","Bakker","Moreau","Santos","Fernandes","Wirtz","Diallo","Hansen","Pereira","Novak","Adeyemi","Musiala","Laurent","Bennett"],NAT=["ENG","FRA","GER","ESP","ITA","BRA","POR","NED"];

const POS=["GK","DR","DC","DC","DL","DM","MC","MC","AMR","AML","ST","GK","DC","DR","DL","MC","AMC","ST","AMR","DM"],GRP={GK:"G",DR:"D",DL:"D",DC:"D",DM:"M",MC:"M",AMC:"M",AMR:"A",AML:"A",ST:"A"};
const ROLE={GK:"SK - De",DR:"WB - Su",DL:"WB - Su",DC:"CD - De",DM:"BWM - De",MC:"BBM - Su",AMC:"AM - At",AMR:"IF - Su",AML:"IF - At",ST:"AF - At"};
const FM={"4-3-3":[[50,92,"GK"],[86,72,"DR"],[62,77,"DC"],[38,77,"DC"],[14,72,"DL"],[50,56,"DM"],[72,42,"MC"],[28,42,"MC"],[84,20,"AMR"],[16,20,"AML"],[50,13,"ST"]],"4-2-3-1":[[50,92,"GK"],[86,72,"DR"],[62,77,"DC"],[38,77,"DC"],[14,72,"DL"],[62,58,"DM"],[38,58,"DM"],[50,36,"AMC"],[84,30,"AMR"],[16,30,"AML"],[50,13,"ST"]],"4-4-2":[[50,92,"GK"],[86,72,"DR"],[62,77,"DC"],[38,77,"DC"],[14,72,"DL"],[86,45,"AMR"],[62,48,"MC"],[38,48,"MC"],[14,45,"AML"],[62,16,"ST"],[38,16,"ST"]]};
const MEN={Cautious:[.8,.8],Balanced:[1,1],Positive:[1.12,1.1],Attacking:[1.3,1.25]};
const NAV=[["home","Home","⌂"],["inbox","Inbox","✉"],["squad","Squad","♟"],["tactics","Tactics","◈"],["sched","Schedule","▦"],["comp","Competitions","♛"],["fin","Finances","€"],["mgr","Manager","☺"]];
const K="fm26_v2",V={};let S=null,M=null,T=null,sel={lg:"Premier League",cl:"Arsenal"};
const $=i=>document.getElementById(i),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const fd=d=>new Date(d).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short",year:"numeric"}),bc=v=>v>=16?"h":v>=13?"m":v<=8?"l":"";
const st=o=>{const n=cl(Math.round((o-55)/7),1,5);return"★".repeat(n)+"☆".repeat(5-n)},nxt=()=>S.fx.find(f=>!f.played);
const res=f=>{const[h,a]=f.score.split("-").map(Number),m=f.home===S.club?h-a:a-h;return m>0?"W":m<0?"L":"D"};
const mail=(s,t,b)=>{S.ib.unshift({s,t,b,d:S.date,r:false});S.ib=S.ib.slice(0,40)};
function mkP(pos,lvl,i){const ovr=cl(lvl+rnd(-9,7),52,90),a={};for(const g in AT)for(const k of AT[g])a[k]=cl(Math.round(ovr/5.2+rnd(-4,4)),2,20);return{id:i,no:i+1,name:pick(FN)+" "+pick(LN),age:rnd(18,34),pos,ovr,pot:cl(ovr+rnd(0,10),ovr,95),nat:pick(NAT),a,form:+(6+Math.random()*1.6).toFixed(2),cond:rnd(88,100),g:0,ap:0,val:Math.round(ovr*ovr/60*rnd(5,10)/10)+1,sal:Math.round(ovr*1.4)*1000,end:2027+rnd(0,3)}}
function xi(){const u=new Set(),r=[];for(const s of FM[S.tc.f]){const c=S.sq.filter(p=>!u.has(p.id)),b=(f)=>c.filter(f).sort((a,b)=>b.ovr-a.ovr)[0],p=b(x=>x.pos===s[2])||b(x=>GRP[x.pos]===GRP[s[2]])||b(x=>1);u.add(p.id);r.push(p)}return r}

function setup(){const l=$("lg"),c=$("cl");l.innerHTML=Object.keys(LG).map(n=>`<div class="chip${n===sel.lg?" on":""}" data-l="${n}">${n}</div>`).join("");

function startCareer(){const g=x=>$(x).value.trim(),big=BIG.includes(sel.cl);
S={mg:(g("fn")||"Manager")+" "+(g("ln")||"FM26"),lg:sel.lg,club:sel.cl,date:"2026-08-01",season:1,tc:{f:$("fo").value,m:"Balanced"},mor:75,board:70,fans:70,bud:big?120:45,sq:real(POS.map((p,i)=>mkP(p,big?78:69,i))),ib:[],view:"news",pid:0,mi:0};

function boot(){$("setup").classList.add("hid");$("app").classList.remove("hid");if(["match","post","pre"].includes(S.view))S.view="home";render()}
function render(){document.documentElement.style.setProperty("--hc","hsl("+hash(S.club)%360+" 55% 26%)");

function cont(){if(S.view==="news"){S.view="home";return render()}if(S.view==="pre")return startMatch();if(S.view==="post"){S.view="home";M=null;return render()}if(S.view==="match"&&M&&!M.done){clearInterval(T);M.p=0;M.sp=12;T=setInterval(tick,12);return}
