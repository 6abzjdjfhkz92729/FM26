<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM26</title>
<style>
:root{--bg:#0e0a1c;--pn:#1b1633;--ln:#ffffff14;--ac:#12a3a8;--tx:#eef0ff;--mu:#8f8bb3}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}.hid{display:none!important}.mu{color:var(--mu)}
#setup{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 25% 0,#4a1a8a66,transparent 55%),var(--bg)}
.sc{width:min(980px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:22px}.sc h1{margin:0;font-size:38px}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:230px}label{display:block;color:var(--mu);font-size:11px;margin-top:8px}
input,select{width:100%;padding:9px;margin:4px 0 8px;background:#0c0919;border:1px solid var(--ln);border-radius:6px;color:#fff}
.lg,.cl,.wr{display:flex;flex-wrap:wrap;gap:6px}.lg,.cl{max-height:210px;overflow:auto}
.chip{padding:7px 11px;border:1px solid var(--ln);border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center;background:#ffffff08}.chip.on{border-color:#b06cff;background:#7b2fbe40}
.btn{background:var(--ac);padding:11px 26px;border-radius:6px;font-weight:800;text-transform:uppercase}
#app{display:grid;grid-template-columns:190px 1fr;height:100%}
#side{background:linear-gradient(180deg,#3a1573,#1a0d38 55%,var(--bg));overflow:auto;padding-top:6px}
.si{display:flex;gap:12px;align-items:center;padding:12px 18px;color:#d9d3f2;border-left:3px solid transparent;width:100%;text-align:left}
.si:hover{background:#ffffff14}.si.on{background:#ffffff20;border-color:#fff;color:#fff;font-weight:600}.si span{width:18px;text-align:center}.si em{font-style:normal}
#main{display:flex;flex-direction:column;min-width:0;height:100%}
#hd{display:flex;align-items:center;gap:14px;padding:12px 22px;background:linear-gradient(90deg,var(--hc,#4a1a8a),#1e1040 60%,#14102c);border-bottom:1px solid var(--ln)}
#hd h2{margin:0;font-size:20px}#hd small{color:#cfc8ee}
.cr{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;color:#fff;border:2px solid #ffffff55;flex:none}
#go{margin-left:auto;background:var(--ac);padding:12px 26px;border-radius:6px;font-weight:800}#go:hover{filter:brightness(1.15)}
#vw{flex:1;overflow:auto;padding:16px 20px}
.gr{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px;min-width:0}
.pn h3{margin:0 0 10px;font-size:11px;color:#17c3c9;letter-spacing:.06em;text-transform:uppercase}
table{width:100%;border-collapse:collapse}th{color:var(--mu);font-size:11px;text-align:left;font-weight:600}td,th{padding:7px 8px;border-bottom:1px solid #ffffff0c}
tr.cp{cursor:pointer}tr.cp:hover{background:#ffffff0e}tr.me{background:#7b2fbe30}
.b{display:inline-block;min-width:28px;text-align:center;border-radius:3px;padding:1px 6px;font-weight:700;background:#5a2a9a;font-style:normal}
.b.h{background:#0f8f95}.b.m{background:#7b35c4}.b.l{background:#35285f;color:#aaa}
.ar{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;background:#ffffff08;margin-bottom:2px}
.mh{display:flex;align-items:center;justify-content:center;gap:18px;font-size:17px;padding:10px;flex-wrap:wrap}
.big{font-size:42px;font-weight:800}.bar{height:8px;background:#0c0919;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7b2fbe,#12a3a8)}
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.shirt{margin-left:auto;padding:10px 26px;border-radius:6px;text-align:center;background:hsl(var(--h) 70% 38%)}.shirt b{font-size:58px;display:block;line-height:1}
.ml{padding:11px 14px;border-bottom:1px solid var(--ln);cursor:pointer}.ml.u{border-left:3px solid #c05cff;background:#7b2fbe1c}
.pitch{position:relative;background:repeating-linear-gradient(90deg,#17803f 0 8%,#1b8c47 8% 16%);border:2px solid #ffffff55;border-radius:6px;overflow:hidden}
.pitch:before{content:"";position:absolute;inset:3%;border:1px solid #fff8}.pitch:after{content:"";position:absolute;left:3%;right:3%;top:50%;border-top:1px solid #fff8}
.pitch.hz:after{left:50%;right:auto;top:3%;bottom:3%;border-top:0;border-left:1px solid #fff8}
.tp{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:11px;width:92px;text-shadow:0 1px 3px #000}.tp i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 2px;border-radius:50%;font-style:normal;font-weight:800;border:2px solid #fffc}
.tp u{display:block;text-decoration:none;background:#3b5fa8;border-radius:3px;font-size:10px;padding:0 3px}.tp b{display:block;background:#0009;border-radius:3px}
.dt{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);transition:left 1s linear,top 1s linear;border:1px solid #0009}
.ball{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);transition:left .8s linear,top .8s linear;z-index:3;box-shadow:0 0 6px #fff}
.mb{display:flex;align-items:center;gap:12px;background:#fff;color:#111;border-radius:4px;width:max-content;max-width:100%;padding:6px 14px;font-weight:800}.mb b{background:#7a2cc9;color:#fff;padding:3px 12px;border-radius:3px}
.strip{display:flex;gap:6px;margin-top:10px;overflow:auto}.strip>div{flex:1;min-width:84px;background:var(--pn);padding:8px;text-align:center;border-radius:6px;font-size:11px}
@media(max-width:820px){#app{grid-template-columns:54px 1fr}.si{padding:13px 0;justify-content:center}.si em{display:none}.g3,.gr[style]{grid-template-columns:1fr!important}#hd small{display:none}}
</style></head><body>
<div id="setup"><div class="sc"><h1>FM26</h1><p class="mu">Create your manager and choose your club.</p>
<div class="row"><div><label>First name</label><input id="fn" placeholder="Côme"><label>Last name</label><input id="ln" placeholder="Dupont"><label>Formation</label><select id="fo"><option>4-3-3</option><option>4-2-3-1</option><option>4-4-2</option></select></div>
<div><label>Competition</label><div class="lg" id="lg"></div></div></div>
<label>Club</label><div class="cl" id="cl"></div><p style="text-align:right"><button class="btn" id="start">Start career</button></p></div></div>
<div id="app" class="hid"><nav id="side"></nav><div id="main"><header id="hd"></header><div id="vw"></div></div></div>
<script>
const LG={"Premier League":["Arsenal","Aston Villa","Bournemouth","Brentford","Brighton","Burnley","Chelsea","Crystal Palace","Everton","Fulham","Leeds","Liverpool","Man City","Man United","Newcastle","Nottingham Forest","Sunderland","Tottenham","West Ham","Wolves"],"La Liga":["Athletic Club","Atlético","Barcelona","Celta","Getafe","Girona","Mallorca","Osasuna","Rayo","Betis","Real Madrid","Real Sociedad","Sevilla","Valencia","Villarreal","Alavés","Espanyol","Levante"],"Serie A":["Atalanta","Bologna","Cagliari","Como","Fiorentina","Genoa","Inter","Juventus","Lazio","Lecce","Milan","Napoli","Parma","Roma","Torino","Udinese","Verona","Sassuolo"],"Bundesliga":["Augsburg","Leverkusen","Bayern","Dortmund","Gladbach","Frankfurt","Freiburg","Heidenheim","Hoffenheim","Mainz","Leipzig","St. Pauli","Stuttgart","Union Berlin","Bremen","Wolfsburg","Hamburg","Köln"],"Ligue 1":["Angers","Auxerre","Brest","Le Havre","Lens","Lille","Lorient","Lyon","Marseille","Metz","Monaco","Nantes","Nice","Paris SG","Rennes","Strasbourg","Toulouse","Paris FC"]};
const BIG=["Man City","Arsenal","Liverpool","Chelsea","Real Madrid","Barcelona","Bayern","Inter","Paris SG","Leverkusen","Dortmund","Milan","Juventus","Napoli","Atlético","Man United","Tottenham","Newcastle"];
const FN=["Lucas","Hugo","Noah","Leo","Marco","Diego","Jamal","Kai","Mateo","Enzo","Luca","Theo","Rafa","Jonas","Declan","Bruno","Pedro","Karim","Florian","Ethan"],LN=["Martin","Silva","Rossi","Müller","Garcia","Costa","Kovac","Bakker","Moreau","Santos","Fernandes","Wirtz","Diallo","Hansen","Pereira","Novak","Adeyemi","Musiala","Laurent","Bennett"],NAT=["ENG","FRA","GER","ESP","ITA","BRA","POR","NED"];
const AT={Technical:["Corners","Crossing","Dribbling","Finishing","First Touch","Free Kick Taking","Heading","Long Shots","Long Throws","Marking","Passing","Penalty Taking","Tackling","Technique"],Mental:["Aggression","Anticipation","Bravery","Composure","Concentration","Decisions","Determination","Flair","Leadership","Off The Ball","Positioning","Teamwork","Vision","Work Rate"],Physical:["Acceleration","Agility","Balance","Jumping Reach","Natural Fitness","Pace","Stamina","Strength"]};
const POS=["GK","DR","DC","DC","DL","DM","MC","MC","AMR","AML","ST","GK","DC","DR","DL","MC","AMC","ST","AMR","DM"],GRP={GK:"G",DR:"D",DL:"D",DC:"D",DM:"M",MC:"M",AMC:"M",AMR:"A",AML:"A",ST:"A"};
const ROLE={GK:"SK - De",DR:"WB - Su",DL:"WB - Su",DC:"CD - De",DM:"BWM - De",MC:"BBM - Su",AMC:"AM - At",AMR:"IF - Su",AML:"IF - At",ST:"AF - At"};
const FM={"4-3-3":[[50,92,"GK"],[86,72,"DR"],[62,77,"DC"],[38,77,"DC"],[14,72,"DL"],[50,56,"DM"],[72,42,"MC"],[28,42,"MC"],[84,20,"AMR"],[16,20,"AML"],[50,13,"ST"]],"4-2-3-1":[[50,92,"GK"],[86,72,"DR"],[62,77,"DC"],[38,77,"DC"],[14,72,"DL"],[62,58,"DM"],[38,58,"DM"],[50,36,"AMC"],[84,30,"AMR"],[16,30,"AML"],[50,13,"ST"]],"4-4-2":[[50,92,"GK"],[86,72,"DR"],[62,77,"DC"],[38,77,"DC"],[14,72,"DL"],[86,45,"AMR"],[62,48,"MC"],[38,48,"MC"],[14,45,"AML"],[62,16,"ST"],[38,16,"ST"]]};
const MEN={Cautious:[.8,.8],Balanced:[1,1],Positive:[1.12,1.1],Attacking:[1.3,1.25]};
const NAV=[["home","Home","⌂"],["inbox","Inbox","✉"],["squad","Squad","♟"],["tactics","Tactics","◈"],["sched","Schedule","▦"],["comp","Competitions","♛"],["fin","Finances","€"]];
const K="fm26_v2",V={};let S=null,M=null,T=null,sel={lg:"Premier League",cl:"Arsenal"};
const $=i=>document.getElementById(i),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const fd=d=>new Date(d).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short",year:"numeric"}),bc=v=>v>=16?"h":v>=13?"m":v<=8?"l":"";
const st=o=>{const n=cl(Math.round((o-55)/7),1,5);return"★".repeat(n)+"☆".repeat(5-n)},nxt=()=>S.fx.find(f=>!f.played);
const crest=(c,z=40)=>`<span class="cr" style="width:${z}px;height:${z}px;font-size:${z/3}px;background:hsl(${hash(c)%360} 55% 36%)">${c.replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").map(w=>w[0]).join("").slice(0,3).toUpperCase()}</span>`;
const res=f=>{const[h,a]=f.score.split("-").map(Number),m=f.home===S.club?h-a:a-h;return m>0?"W":m<0?"L":"D"};
const mail=(s,t,b)=>{S.ib.unshift({s,t,b,d:S.date,r:false});S.ib=S.ib.slice(0,40)};
function mkP(pos,lvl,i){const ovr=cl(lvl+rnd(-9,7),52,90),a={};for(const g in AT)for(const k of AT[g])a[k]=cl(Math.round(ovr/5.2+rnd(-4,4)),2,20);return{id:i,no:i+1,name:pick(FN)+" "+pick(LN),age:rnd(18,34),pos,ovr,pot:cl(ovr+rnd(0,10),ovr,95),nat:pick(NAT),a,form:+(6+Math.random()*1.6).toFixed(2),cond:rnd(88,100),g:0,ap:0,val:Math.round(ovr*ovr/60*rnd(5,10)/10)+1,sal:Math.round(ovr*1.4)*1000,end:2027+rnd(0,3)}}
function xi(){const u=new Set(),r=[];for(const s of FM[S.tc.f]){const c=S.sq.filter(p=>!u.has(p.id)),b=(f)=>c.filter(f).sort((a,b)=>b.ovr-a.ovr)[0],p=b(x=>x.pos===s[2])||b(x=>GRP[x.pos]===GRP[s[2]])||b(x=>1);u.add(p.id);r.push(p)}return r}
const pw=c=>c===S.club?Math.round(xi().reduce((s,p)=>s+p.ovr,0)/11+(S.mor-75)/8):62+hash(c)%12+(BIG.includes(c)?9:0);
function mkFx(){const o=LG[S.lg].filter(c=>c!==S.club);let d=new Date(S.date);return[...o,...o].map((x,i)=>{d=new Date(d.getTime()+7*864e5);const h=i%2===0;return{id:i,date:d.toISOString(),home:h?S.club:x,away:h?x:S.club,played:false,score:""}})}
const newTb=()=>{S.tb={};LG[S.lg].forEach(c=>S.tb[c]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})};
const tbl=()=>Object.entries(S.tb).map(([c,t])=>({c,...t,gd:t.gf-t.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
const upd=(h,a,gh,ga)=>[[h,gh,ga],[a,ga,gh]].forEach(([c,f,g])=>{const t=S.tb[c];t.p++;t.gf+=f;t.ga+=g;if(f>g){t.w++;t.pts+=3}else if(f===g){t.d++;t.pts++}else t.l++});

function setup(){const l=$("lg"),c=$("cl");l.innerHTML=Object.keys(LG).map(n=>`<div class="chip${n===sel.lg?" on":""}" data-l="${n}">${n}</div>`).join("");
l.onclick=e=>{const n=e.target.closest("[data-l]");if(n){sel={lg:n.dataset.l,cl:LG[n.dataset.l][0]};setup()}};
c.innerHTML=LG[sel.lg].map(n=>`<div class="chip${n===sel.cl?" on":""}" data-c="${n}">${crest(n,26)}${n}</div>`).join("");
c.onclick=e=>{const n=e.target.closest("[data-c]");if(n){sel.cl=n.dataset.c;setup()}}}
function startCareer(){const g=x=>$(x).value.trim(),big=BIG.includes(sel.cl);
S={mg:(g("fn")||"Manager")+" "+(g("ln")||"FM26"),lg:sel.lg,club:sel.cl,date:"2026-08-01",season:1,tc:{f:$("fo").value,m:"Balanced"},mor:75,board:70,fans:70,bud:big?120:45,sq:POS.map((p,i)=>mkP(p,big?78:69,i)),ib:[],view:"home",pid:0,mi:0};
newTb();S.fx=mkFx();mail("Board","Welcome to "+S.club,"The board is delighted to have you. We expect a coherent project, solid results and responsible spending this season.");
mail("Assistant Manager","Pre-season report","The squad is ready. Check the Tactics screen, pick your formation and mentality, then press CONTINUE to play your first match.");sv();boot()}
function boot(){$("setup").classList.add("hid");$("app").classList.remove("hid");if(S.view==="match")S.view="home";render()}
function render(){document.documentElement.style.setProperty("--hc","hsl("+hash(S.club)%360+" 55% 26%)");
const un=S.ib.filter(m=>!m.r).length;
$("side").innerHTML=NAV.map(n=>`<button class="si${S.view===n[0]?" on":""}" data-v="${n[0]}"><span>${n[2]}</span><em>${n[1]}${n[0]==="inbox"&&un?" ("+un+")":""}</em></button>`).join("")+`<button class="si" data-v="reset"><span>↻</span><em>New career</em></button>`;
const ti={home:"Home",inbox:"Inbox",squad:"Squad",player:"Player Profile",tactics:"Tactics",sched:"Schedule",comp:"Competitions",fin:"Finances",match:"Match"}[S.view];
$("hd").innerHTML=crest(S.club,46)+`<div><h2>${ti}</h2><small>${S.club} · ${S.lg} · ${fd(S.date)} · Manager ${S.mg}</small></div><button id="go">${S.view==="match"?(M&&M.done?"CONTINUE":"SKIP ▶▶"):nxt()?"CONTINUE":"NEW SEASON"}</button>`;
$("go").onclick=cont;$("vw").innerHTML=V[S.view]();if(S.view==="match")draw()}
function cont(){if(S.view==="match"&&M&&!M.done){clearInterval(T);T=setInterval(tick,12);return}
if(S.view==="match"){S.view="home";M=null;S.sq.forEach(p=>p.cond=cl(p.cond+6,50,100));sv();return render()}
if(nxt())startMatch();else newSeason()}
function startMatch(){const f=nxt(),me=f.home===S.club;M={f,min:0,h:0,a:0,ev:[],sh:[0,0],ps:50,done:false,hp:pw(f.home),ap:pw(f.away),m:MEN[S.tc.m],bx:50,by:50};
S.view="match";render();clearInterval(T);T=setInterval(tick,170)}
function tick(){M.min++;const f=M.f,me=f.home===S.club,r=cl(M.hp/M.ap,.6,1.6),[a,d]=M.m,ph=.03*r**3*1.1*(me?a:d),pa=.03*(1/r)**3*(me?d:a),ev=(k,t)=>M.ev.unshift({m:M.min,k,t});
M.ps=cl(Math.round(50+(r-1)*40+rnd(-4,4)),30,70);
if(Math.random()<ph){M.h++;M.sh[0]++;ev("⚽",f.home+" score! "+M.h+"-"+M.a);M.bx=95}
else if(Math.random()<pa){M.a++;M.sh[1]++;ev("⚽",f.away+" score! "+M.h+"-"+M.a);M.bx=5}
else{if(Math.random()<.1){const s=Math.random()<ph/(ph+pa)?0:1;M.sh[s]++;ev("◉","Shot by "+(s?f.away:f.home)+", saved.")}if(Math.random()<.025)ev("🟨","Yellow card — "+(Math.random()<.5?f.home:f.away))}
M.bx=cl(M.bx+rnd(-14,14)+(M.ps-50)*.25,5,95);M.by=cl(M.by+rnd(-12,12),8,92);draw();if(M.min>=90)endMatch()}
function draw(){const pt=$("pt");if(!pt||!M)return;$("tm").textContent=String(M.min).padStart(2,"0")+":00";$("sc").textContent=M.h+" - "+M.a;
pt.querySelectorAll(".dt").forEach(e=>{e.style.left=cl(+e.dataset.x+(M.bx-50)*.3+rnd(-3,3),3,97)+"%";e.style.top=cl(+e.dataset.y+(M.by-50)*.15+rnd(-3,3),4,96)+"%"});
$("bl").style.left=M.bx+"%";$("bl").style.top=M.by+"%";
$("ms").innerHTML=[["Possession",M.ps+"% - "+(100-M.ps)+"%"],["Shots",M.sh[0]+" - "+M.sh[1]]].map(r=>`<div class="ar"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("");
$("evs").innerHTML=M.ev.map(e=>`<p style="margin:4px 0">${e.m}' ${e.k} ${e.t}</p>`).join("")}
function endMatch(){clearInterval(T);M.done=true;const f=M.f,me=f.home===S.club,mg=me?M.h:M.a,og=me?M.a:M.h,w=mg>og?1:mg<og?-1:0;
f.played=true;f.score=M.h+"-"+M.a;upd(f.home,f.away,M.h,M.a);
const rest=LG[S.lg].filter(c=>c!==f.home&&c!==f.away).sort(()=>Math.random()-.5),g=c=>{let n=0;for(let k=0;k<6;k++)if(Math.random()<(pw(c)/70)**3*.2)n++;return n};
for(let i=0;i+1<rest.length;i+=2)upd(rest[i],rest[i+1],g(rest[i]),g(rest[i+1]));
S.mor=cl(S.mor+w*3,30,100);S.board=cl(S.board+w*2,0,100);S.fans=cl(S.fans+w*3,0,100);
const X=xi();X.forEach(p=>{p.ap++;p.cond=cl(p.cond-rnd(8,16),50,100);p.form=cl(+(p.form+w*.2+rnd(-2,2)/10).toFixed(2),5,9.5)});
for(let i=0;i<mg;i++)pick(X.filter(p=>GRP[p.pos]!=="G"&&GRP[p.pos]!=="D")).g++;
mail("Match report",f.home+" "+M.h+"-"+M.a+" "+f.away,"Full time. Shots "+M.sh[0]+"-"+M.sh[1]+", possession "+M.ps+"%-"+(100-M.ps)+"%. "+(w>0?"The board is pleased with the result.":w<0?"The supporters expect a reaction.":"A point apiece."));
S.date=f.date;sv();$("go").textContent="CONTINUE"}
function newSeason(){const t=tbl(),pos=t.findIndex(x=>x.c===S.club)+1;S.board=cl(S.board+(pos<=5?8:pos>t.length-4?-10:0),0,100);
mail("Board","Season "+S.season+" review","You finished "+pos+(pos===1?"st — champions!":"th")+" of "+t.length+". The new season starts now.");
S.season++;S.date=(2025+S.season)+"-08-01";S.sq.forEach(p=>{p.age++;p.ovr=cl(p.ovr+(p.age<24?rnd(0,3):p.age>31?-rnd(0,3):rnd(-1,1)),50,92);p.g=0;p.ap=0;p.cond=100});newTb();S.fx=mkFx();sv();render()}
function openP(i){S.pid=i;S.view="player";render()}function rd(i){S.ib[i].r=true;S.mi=i;render()}function tc(k,v){S.tc[k]=v;sv();render()}

V.home=()=>{const n=nxt(),t=tbl(),me=t.find(x=>x.c===S.club),last=S.fx.filter(f=>f.played).slice(-5);
return`<div class="gr g3"><div class="pn" style="grid-column:span 2"><h3>Next match</h3>${n?`<div class="mh">${crest(n.home,60)}<b>${n.home}</b><span class="mu">vs</span><b>${n.away}</b>${crest(n.away,60)}</div><p class="mu" style="text-align:center">${fd(n.date)}</p>`:"<p>Season complete — press NEW SEASON.</p>"}</div>
<div class="pn"><h3>League position</h3><div class="big">${t.indexOf(me)+1}<small class="mu">/${t.length}</small></div><p class="mu">${me.pts} pts · GD ${me.gd}</p></div>
<div class="pn"><h3>Form</h3>${last.map(f=>{const r=res(f);return`<span class="b ${r==="W"?"h":r==="D"?"m":"l"}">${r}</span> `}).join("")||'<span class="mu">No match played yet</span>'}</div>
<div class="pn"><h3>Board confidence</h3><div class="bar"><i style="width:${S.board}%"></i></div><p class="mu">${S.board}% · Fans ${S.fans}% · Morale ${S.mor}%</p></div>
<div class="pn"><h3>Inbox</h3>${S.ib.slice(0,3).map(m=>`<p style="margin:4px 0"><b>${m.s}</b><br><span class="mu">${m.t}</span></p>`).join("")}</div>
<div class="pn" style="grid-column:span 3"><h3>Top scorers</h3>${[...S.sq].sort((a,b)=>b.g-a.g).slice(0,5).map(p=>`<div class="ar"><span>${p.name}</span><b>${p.g} goals</b></div>`).join("")}</div></div>`};
V.inbox=()=>{const m=S.ib[S.mi]||S.ib[0];return`<div class="gr" style="grid-template-columns:320px 1fr"><div class="pn" style="padding:0">${S.ib.map((x,i)=>`<div class="ml${x.r?"":" u"}" onclick="rd(${i})"><b>${x.s}</b><br><span class="mu">${x.t}</span></div>`).join("")}</div><div class="pn"><h3>${m.s}</h3><h2 style="margin:0 0 6px">${m.t}</h2><p class="mu">${fd(m.d)}</p><p>${m.b}</p></div></div>`};
V.squad=()=>`<div class="pn"><table><tr><th>No</th><th>Name</th><th>Pos</th><th>Age</th><th>Rating</th><th>Form</th><th>Cond</th><th>Apps</th><th>Gls</th><th>Value</th></tr>${S.sq.map(p=>`<tr class="cp" onclick="openP(${p.id})"><td>${p.no}</td><td><b>${p.name}</b></td><td>${p.pos}</td><td>${p.age}</td><td><i class="b ${bc(p.ovr/5)}">${p.ovr}</i></td><td>${p.form.toFixed(1)}</td><td>${p.cond}%</td><td>${p.ap}</td><td>${p.g}</td><td>€${p.val}M</td></tr>`).join("")}</table></div>`;
V.player=()=>{const p=S.sq.find(x=>x.id===S.pid)||S.sq[0];return`<div class="pn ph" style="--h:${hash(S.club)%360}">${crest(S.club,70)}<div><h2 style="margin:0">${p.no}. ${p.name.toUpperCase()}</h2><span class="mu">${p.pos} · ${p.age} years old · ${p.nat}</span><br>${st(p.ovr)} <span class="mu">Potential ${st(p.pot)}</span></div><div class="shirt"><small>${p.name.split(" ")[1].toUpperCase()}</small><b>${p.no}</b></div></div>
<div class="gr" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px">${Object.entries(AT).map(([g,ks])=>`<div class="pn"><h3>${g}</h3>${ks.map(k=>`<div class="ar"><span>${k}</span><i class="b ${bc(p.a[k])}">${p.a[k]}</i></div>`).join("")}</div>`).join("")}
<div class="pn"><h3>Transfer info</h3><div class="ar"><span>Value</span><b>€${p.val}M</b></div><h3 style="margin-top:14px">Contract</h3><div class="ar"><span>Salary</span><b>€${p.sal.toLocaleString("fr-FR")}/wk</b></div><div class="ar"><span>Ends</span><b>30/06/${p.end}</b></div><h3 style="margin-top:14px">Season stats</h3><div class="ar"><span>Apps</span><b>${p.ap}</b></div><div class="ar"><span>Goals</span><b>${p.g}</b></div><div class="ar"><span>Av rat</span><b>${p.form.toFixed(2)}</b></div><div class="ar"><span>Condition</span><b>${p.cond}%</b></div></div></div>`};
V.tactics=()=>{const x=xi(),F=FM[S.tc.f],h=hash(S.club)%360,bench=S.sq.filter(p=>!x.includes(p)),op=(k,vs)=>`<div class="wr">${vs.map(v=>`<button class="chip${S.tc[k]===v?" on":""}" onclick="tc('${k}','${v}')">${v}</button>`).join("")}</div>`;
return`<div class="gr" style="grid-template-columns:220px minmax(300px,400px) 1fr"><div class="pn"><h3>Tactical style</h3><p><b>Formation</b></p>${op("f",Object.keys(FM))}<p><b>Mentality</b></p>${op("m",Object.keys(MEN))}<p class="mu">Team strength ${pw(S.club)}</p></div>
<div class="pitch" style="aspect-ratio:3/4">${F.map((s,i)=>`<div class="tp" style="left:${s[0]}%;top:${s[1]}%"><i style="background:hsl(${h} 65% 42%)">${x[i].no}</i><u>${ROLE[s[2]]}</u><b>${x[i].name.split(" ")[1]}</b></div>`).join("")}</div>
<div class="pn"><h3>Selection</h3><table><tr><th>Pos</th><th>Role</th><th></th><th>Player</th><th>Av rat</th></tr>${F.map((s,i)=>`<tr class="cp" onclick="openP(${x[i].id})"><td>${s[2]}</td><td>${ROLE[s[2]]}</td><td class="mu">${st(x[i].ovr)}</td><td>${x[i].name}</td><td>${x[i].form.toFixed(1)}</td></tr>`).join("")}${bench.slice(0,7).map((p,i)=>`<tr class="cp mu" onclick="openP(${p.id})"><td>S${i+1}</td><td>${p.pos}</td><td>${st(p.ovr)}</td><td>${p.name}</td><td>${p.form.toFixed(1)}</td></tr>`).join("")}</table></div></div>`};
V.sched=()=>`<div class="pn"><table><tr><th>Date</th><th>Match</th><th>Result</th></tr>${S.fx.map(f=>`<tr><td>${fd(f.date)}</td><td>${f.home} v ${f.away}</td><td>${f.played?`<span class="b ${{W:"h",D:"m",L:"l"}[res(f)]}">${f.score}</span>`:"—"}</td></tr>`).join("")}</table></div>`;
V.comp=()=>`<div class="pn"><h3>${S.lg}</h3><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>${tbl().map((t,i)=>`<tr class="${t.c===S.club?"me":""}"><td>${i+1}</td><td>${t.c}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd}</td><td><b>${t.pts}</b></td></tr>`).join("")}</table></div>`;
V.fin=()=>`<div class="gr g3"><div class="pn"><h3>Transfer budget</h3><div class="big">€${S.bud}M</div></div><div class="pn"><h3>Wage bill</h3><div class="big">€${(S.sq.reduce((s,p)=>s+p.sal,0)/1e6).toFixed(2)}M</div><p class="mu">per week</p></div><div class="pn"><h3>Squad value</h3><div class="big">€${S.sq.reduce((s,p)=>s+p.val,0)}M</div></div></div>`;
V.match=()=>{const f=M.f,F=FM[S.tc.f],dot=h=>F.map(s=>{const x=4+(100-s[1])*.42;return`<i class="dt" style="background:${h?"#f5c542":"#eee"}" data-x="${h?x:100-x}" data-y="${h?s[0]:100-s[0]}"></i>`}).join("");
return`<div class="mb"><span id="tm">00:00</span>${f.home}<b id="sc">0 - 0</b>${f.away}</div><div class="gr" style="grid-template-columns:minmax(0,1fr) 300px;margin-top:10px"><div class="pitch hz" id="pt" style="aspect-ratio:16/9">${dot(1)}${dot(0)}<i class="ball" id="bl"></i></div><div class="pn"><h3>Match stats</h3><div id="ms"></div><h3 style="margin-top:12px">Match events</h3><div id="evs" style="max-height:220px;overflow:auto"></div></div></div><div class="strip">${xi().map(p=>`<div><small>${p.pos}</small><br>${p.name.split(" ")[1]}<br><i class="b h">${p.form.toFixed(1)}</i></div>`).join("")}</div>`};

$("start").onclick=startCareer;
$("side").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;const v=b.dataset.v;if(v==="reset"){if(confirm("Start a new career?")){localStorage.removeItem(K);location.reload()}return}S.view=v;render()};
setup();try{const raw=JSON.parse(localStorage.getItem(K));if(raw&&raw.sq&&raw.fx&&raw.tb){S=raw;boot()}}catch(e){localStorage.removeItem(K)}
</script></body></html>
