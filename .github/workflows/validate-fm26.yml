name: Validate FM26
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check all JavaScript modules and inline scripts
        run: |
          set -e
          for file in fm26-phase1.js fm26-engine.js fm26-advanced.js fm26-world.js fm26-experience.js fm26-international.js; do
            test -f "$file"
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const modules = [
            'fm26-phase1.js',
            'fm26-engine.js',
            'fm26-advanced.js',
            'fm26-world.js',
            'fm26-experience.js',
            'fm26-international.js'
          ];
          let previous = -1;
          for (const file of modules) {
            const at = html.indexOf('./' + file);
            if (at < 0 || at <= previous || !fs.existsSync(file)) {
              throw new Error('Module missing or incorrectly ordered: ' + file);
            }
            previous = at;
          }
          const inline = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)]
            .filter(m => !/^<script\s+src=/i.test(m[0]));
          if (!inline.length) throw new Error('No inline game script found');
          inline.forEach((m, i) => fs.writeFileSync('/tmp/fm26-inline-' + i + '.js', m[1]));
          console.log('Verified module order and extracted ' + inline.length + ' inline script(s).');
          NODE
          for file in /tmp/fm26-inline-*.js; do node --check "$file"; done
